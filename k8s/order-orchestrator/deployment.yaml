apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-orchestrator
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-orchestrator
  template:
    metadata:
      labels:
        app: order-orchestrator
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: order-orchestrator
          image: ghcr.io/YOUR_GITHUB_USERNAME/order-orchestrator:latest
          ports:
            - containerPort: 3001
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_CLIENT_ID
              value: "order-orchestrator"
            - name: ORDER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ORDER_DATABASE_URL
            - name: ORCHESTRATOR_PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 20