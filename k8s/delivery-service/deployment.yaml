apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: delivery-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/delivery-service:latest
          ports:
            - containerPort: 3004
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_CLIENT_ID
              value: "delivery-service"
            - name: DELIVERY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DELIVERY_DATABASE_URL
            - name: DELIVERY_SERVICE_PORT
              value: "3004"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 40
            periodSeconds: 20