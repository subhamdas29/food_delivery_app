apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: restaurant-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/restaurant-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_CLIENT_ID
              value: "restaurant-service"
            - name: RESTAURANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RESTAURANT_DATABASE_URL
            - name: RESTAURANT_SERVICE_PORT
              value: "3003"
            - name: RESTAURANT_REJECTION_RATE
              value: "0.2"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 40
            periodSeconds: 20