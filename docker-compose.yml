version: "3.9"

services:

  kafka:

    image: apache/kafka:latest
    container_name: kafka
    ports: 
      -"9092:9092"
      -"9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ── Listeners ───────────────────────────────────────────
      # PLAINTEXT      → used by host machine (your local services / kafka-ui)
      # PLAINTEXT_INT  → used by other Docker containers (services inside compose)
      # CONTROLLER     → KRaft internal controller traffic only

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, PLAINTEXT_INT://0.0.0.0:29092, CONTROLLER://0.0.0.0.9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092, PLAINTEXT_INT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_INT:PLAINTEXT, CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAMES: PLAINTEXT_INT

      #To regenerate: docker run --rm apache/kafka:latest kafka-storage random-uuid
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      #BROKER SETTINGS
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    
    volumes:
      -kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka topic initialiser (runs once then exits) ─────────
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c"]
    command: |
      "
      echo 'Waiting for Kafka to be fully ready...'
      sleep 5

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic orders.lifecycle     --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic payments.commands    --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic payments.events      --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic restaurant.commands  --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic restaurant.events    --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic delivery.commands    --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic delivery.events      --replication-factor 1 --partitions 3

      echo '──────────────────────────────────────'
      echo 'All topics created. Listing topics:'
      kafka-topics --bootstrap-server kafka:29092 --list
      echo '──────────────────────────────────────'
      "
    restart: "no"

  # DATABASE(single container but 4 logical db)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      -"5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes: 
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD_SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      
      
  # KAFKA-UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  kafka-data:
  postgres-data: